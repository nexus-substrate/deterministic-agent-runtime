[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deterministic-agent-runtime"
version = "0.1.0"
description = "Deterministic, event-driven programmable agent runtime"
requires-python = ">=3.12"
license = "MIT"
readme = "README.md"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "mypy>=1.10",
    "ruff>=0.4",
    "pre-commit",
]

[tool.hatch.build.targets.wheel]
packages = [
    "core",
    "policies",
    "adapters",
    "executor",
    "telemetry",
    "replay",
    "plugins",
    "llm",
    "eval",
    "console",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "TCH", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
